[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "sedmetrics"
# Platforms with tested wheels: macOS arm64 and Linux x86_64. Others are
# best effort; see "Supported platforms" in README.md.
description = "Evaluation metrics for Sound Event Detection"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
dynamic = ["version"]
keywords = ["sound event detection", "evaluation", "metrics", "audio", "dcase"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/LakoreAI/sed-metrics"
Repository = "https://github.com/LakoreAI/sed-metrics"
Issues = "https://github.com/LakoreAI/sed-metrics/issues"

[project.scripts]
sedmetrics = "sedmetrics.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
# Reference oracles for parity tests. Never runtime dependencies of the core.
# sed_scores_eval needs writable numpy buffers (pandas < 3) and a working
# SciPy; on some macOS/Python combinations the SciPy wheels are broken, so the
# parity suite is often run from a separate 3.12 environment.
parity = [
    "sed_eval==0.2.1",
    "setuptools<81",
    "sed_scores_eval==0.0.4",
    "numpy",
    "pandas<3",
    "scikit-learn==1.9.1",
]
# Dataset adapters for AudioSet strong parquet.
data = ["pyarrow>=15"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/sedmetrics-python/Cargo.toml"
python-source = "python"
module-name = "sedmetrics._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
