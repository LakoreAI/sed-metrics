site_name: SEDMetrics
site_description: Sound event detection evaluation for Python and Rust
hooks:
  - tools/mkdocs_hooks.py
site_url: https://lakoreai.github.io/sed-metrics/
site_author: The SEDMetrics authors
# Locally written papers (ignored by git) are not part of the site.
exclude_docs: |
  /papers/
copyright: "&copy; 2026 The SEDMetrics authors. Apache-2.0."
repo_url: https://github.com/LakoreAI/sed-metrics
repo_name: LakoreAI/sed-metrics
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  font:
    text: Host Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/sedmetrics.css
  - assets/stylesheets/penalty.css
extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/auto-render.min.js
  - assets/javascripts/math.js
  - assets/javascripts/penalty.js
  - assets/javascripts/tabs.js
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - How metrics penalise mistakes: penalties.md
      - Choosing metrics: choosing-metrics.md
      - Dataset adapters: adapters.md
      - Streaming protocol: streaming-protocol.md
  - Metrics:
      - Event F1: metrics/event_f1.md
      - Segment metrics: metrics/segment_f1.md
      - Frame labels: metrics/frame_binary.md
      - Frame events: metrics/frame_events.md
      - PSDS: metrics/psds.md
      - piPSDS: metrics/pipsds.md
      - Brier score: metrics/brier.md
  - API reference: api.md
  - Development: development.md
